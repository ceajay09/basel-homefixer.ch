# Contact SMTP is disabled until deliberately configured through server environment variables.
app.contact.enabled=${CONTACT_MAIL_ENABLED:false}
app.contact.smtp-host=${CONTACT_SMTP_HOST:smtp.gmail.com}
app.contact.smtp-port=${CONTACT_SMTP_PORT:587}
app.contact.smtp-password=${CONTACT_SMTP_PASSWORD:}
app.contact.smtp-ssl=${CONTACT_SMTP_SSL:false}
app.contact.trusted-proxies=${CONTACT_TRUSTED_PROXIES:}

# Disabled SMTP must not make the existing backend health check fail.
management.health.mail.enabled=false
