<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="design-source" content="My-App_Frontend/src/home/TechInsights.tsx">
    <title>Tech Insights – Basel Home Fixer</title>
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --color-primary: #2d5a3d;
            --color-primary-light: #3d7a4d;
            --color-gold: #d4a574;
            --color-gold-light: #e8c9a0;
            --color-silver: #c0c0c0;
            --color-silver-light: #e8e8e8;
            --color-white: #ffffff;
            --color-off-white: #f9f8f6;
            --color-dark-text: #1f1f1f;
            --color-light-text: #5a5a5a;
            --color-border: #d9d9d9;
            --color-code-bg: #1e293b;
            --color-code-text: #e2e8f0;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            --font-family-mono: "Courier New", Courier, monospace;

            --schrift-basis: 16px;
            --seitenbreite: 1152px;
            --abstand: 24px;
            --box-innenabstand: 16px;
            --rundung: 6px;
            --radius-lg: 12px;
        }
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: var(--color-white);
            color: var(--color-dark-text);
            font: var(--schrift-basis)/1.6 var(--font-family);
        }
        a {
            color: var(--color-primary);
            text-decoration: none;
            text-underline-offset: 3px;
            transition: all 0.3s ease;
        }
        a:hover {
            color: var(--color-gold);
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
        }
        h1, h2, h3, p {
            margin-top: 0;
        }
        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 400;
            line-height: 1.2;
            text-align: center;
            margin-bottom: 32px;
            color: var(--color-dark-text);
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.35;
            color: var(--color-primary);
        }
        h3 {
            font-size: 1.2rem;
            line-height: 1.4;
            color: var(--color-dark-text);
        }
        p:last-child {
            margin-bottom: 0;
        }
        code {
            background-color: var(--color-code-bg);
            color: var(--color-code-text);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-family-mono);
            font-size: 14px;
        }
        /* ===== HEADER & NAVIGATION ===== */
        header {
            background-color: var(--color-white);
            border-bottom: 1px solid var(--color-silver-light);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }
        .header-content {
            max-width: var(--seitenbreite);
            margin: 0 auto;
            padding: var(--abstand) var(--abstand);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .logo img {
            height: 40px;
            width: auto;
        }
        .brand-row {
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 78px;
            border-bottom: 1px solid var(--color-border);
        }
        .brand {
            flex: 1;
            text-align: center;
            color: inherit;
            text-decoration: none;
            font-size: 1.5rem;
        }
        .language {
            font-size: 0.85rem;
            color: var(--color-light-text);
        }
        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        nav a {
            font-weight: 500;
            color: var(--color-dark-text);
            font-size: 0.9rem;
        }
        nav a:hover {
            color: var(--color-gold);
        }
        .lang-switch {
            color: var(--color-light-text);
            font-size: 0.85rem;
            border-left: 1px solid var(--color-border);
            padding-left: var(--abstand);
        }
        .lang-switch a {
            margin: 0 var(--spacing-xs);
        }
        /* ===== MAIN CONTENT ===== */
        .container {
            width: min(var(--seitenbreite), calc(100% - 40px));
            margin-inline: auto;
        }
        main {
            padding-top: 24px;
            padding-bottom: 40px;
        }
        /* ===== BOXES & SECTIONS ===== */
        .box {
            background: var(--color-white);
            padding: var(--box-innenabstand);
            border-radius: var(--rundung);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            min-width: 0;
            margin-bottom: var(--abstand);
        }
        .box h2 {
            margin-bottom: var(--abstand);
        }
        .box p {
            color: var(--color-light-text);
            line-height: 1.8;
        }
        .stack > * + * {
            margin-top: var(--abstand);
        }
        .grid-three {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--abstand);
        }
        .grid-about {
            display: grid;
            grid-template-columns: 5fr 7fr;
            gap: var(--abstand);
        }
        .grid-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }
        .contact-box {
            border: 2px solid var(--color-primary);
            border-left: 5px solid var(--color-gold);
        }
        /* ===== TECH DETAILS ===== */
        details {
            border: 1px solid var(--color-border);
            border-radius: var(--rundung);
            background: var(--color-white);
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        summary {
            cursor: pointer;
            padding: var(--box-innenabstand);
            font-weight: 600;
            color: var(--color-primary);
            background-color: var(--color-off-white);
            border-radius: var(--rundung);
            transition: all 0.3s ease;
        }
        summary:hover {
            background-color: #f0f0f0;
            color: var(--color-gold);
        }
        details > div {
            padding: 0 var(--box-innenabstand) var(--box-innenabstand);
        }
        details > div p {
            color: var(--color-light-text);
            line-height: 1.8;
        }
        details > div ul {
            list-style: none;
            padding: 0;
        }
        details > div li {
            padding: 8px 0;
            padding-left: 24px;
            position: relative;
            color: var(--color-light-text);
        }
        details > div li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--color-gold);
            font-weight: bold;
        }
        /* ===== FOOTER ===== */
        footer {
            background-color: var(--color-dark-text);
            color: var(--color-white);
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid var(--color-border);
        }
        .footer-content {
            max-width: var(--seitenbreite);
            margin: 0 auto;
            padding: 0 var(--abstand);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--abstand);
            margin-bottom: var(--abstand);
        }
        .footer-section h3 {
            font-size: 1.2rem;
            margin-bottom: var(--abstand);
            color: var(--color-gold);
        }
        .footer-section p, .footer-section a {
            color: #cccccc;
            font-size: 0.9rem;
            line-height: 1.8;
        }
        .footer-section a:hover {
            color: var(--color-gold);
        }
        .site-footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid var(--color-border);
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .site-footer small {
            display: block;
            color: var(--color-light-text);
            margin-top: 24px;
        }
        /* ===== DESIGN TEMPLATE NOTE ===== */
        .template-note {
            background: #eef5ff;
            color: #243f64;
            border-bottom: 1px solid #cfdef3;
            padding: 10px 20px;
            font: 13px/1.5 Arial, sans-serif;
        }
        .template-note a {
            color: inherit;
        }
        .content-note {
            border-left: 3px solid #bd7b00;
            background: #fff7e5;
            padding: 12px 16px;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .content-note strong {
            display: block;
        }
        .optional {
            font-size: 0.85rem;
            color: var(--color-light-text);
        }
        /* ===== RESPONSIVE MOBILE ===== */
        @media (max-width: 899px) {
            .grid-three, .grid-about, .grid-content {
                grid-template-columns: 1fr;
            }
            .brand-row {
                min-height: 68px;
            }
            .brand {
                text
