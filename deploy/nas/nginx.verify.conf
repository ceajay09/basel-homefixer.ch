worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format limited '$request_method $uri $status';
  access_log /dev/stdout limited;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  map $request_uri $spa_cache { default no-cache; ~^/admin no-store; }
  server {
    listen 8082;
    server_name basel-homefixer.ch;
    root /usr/share/nginx/html;
    index index.html;
    location = /api { return 404; }
    location ^~ /api/ {
      client_max_body_size 16m;
      proxy_pass http://backend:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 40s;
    }
    location ^~ /actuator { return 404; }
    location ^~ /data/ { return 404; }
    location ^~ /content/ { return 404; }
    location ^~ /admin {
      add_header Cache-Control "no-store" always;
      try_files $uri /index.html;
    }
    location = /index.html { add_header Cache-Control $spa_cache always; }
    location / { try_files $uri $uri/ /index.html; }
  }
}

