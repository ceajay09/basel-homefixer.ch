# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'My-App_Frontend/**'
      - '.github/workflows/React-Build-basel-homefixer-Frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'My-App_Frontend/**'
      - '.github/workflows/React-Build-basel-homefixer-Frontend.yml'

jobs:

  build-react:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: My-App_Frontend/package-lock.json
    - name: Use npm 11
      run: |
        npm install -g npm@11.16.0
        npm --version
    - name: Install dependencies
      run: npm ci
      working-directory: My-App_Frontend
    - name: Build frontend
      run: npm run build --if-present
      working-directory: My-App_Frontend
      env:
        REACT_APP_API_URL: ${{ '' }} #Empty String

    - name: Archive Frontend Build Artefact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-react
        path: My-App_Frontend/dist

  push-to-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    needs: build-react
    runs-on: ubuntu-latest
    steps:

      
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Frontend Build Artefact
        uses: actions/download-artifact@v4
        with:
          name: frontend-react
          path: My-App_Frontend/dist




      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      - run: ls

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: basel-homefixer-frontend
          #IMAGE_TAG: ${{ github.sha }}
          IMAGE_TAG: dev
        run: |
          cd My-App_Frontend
          ls -la
          echo $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
    

 
