# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI for Backend

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'My-App_Backend/**'
      - '.github/workflows/build-maven_basel-homefixer-Backend.yml'
      - 'deploy/nas/PrepareJar.java'
      - 'deploy/nas/ValidateRelease.java'
      - 'design/Kundenpaket_20261024/Kundenpaket/assets/**'
  push:
    branches:
      - main
    paths:
      - 'My-App_Backend/**'
      - '.github/workflows/build-maven_basel-homefixer-Backend.yml'
      - 'deploy/nas/PrepareJar.java'
      - 'deploy/nas/ValidateRelease.java'
      - 'design/Kundenpaket_20261024/Kundenpaket/assets/**'

jobs:
  build-jar:
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'corretto'
        cache: maven
    - name: Validate package token
      run: |
        if [ -z "$PACKAGES_TOKEN" ]; then
          echo "PACKAGES_TOKEN is empty or not available to this workflow."
          exit 1
        fi
        echo "PACKAGES_TOKEN is available."
      env:
        PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
    - name: Configure Maven for GitHub Packages
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<'EOF'
        <settings>
          <servers>
            <server>
              <id>github</id>
              <username>ceajay09</username>
              <password>${env.PACKAGES_TOKEN}</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>github-packages</id>
              <repositories>
                <repository>
                  <id>github</id>
                  <url>https://maven.pkg.github.com/ceajay09/shared-backend-parent</url>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>github-packages</activeProfile>
          </activeProfiles>
        </settings>
        EOF
      env:
        PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
    - name: Build Backend with Maven
      run: |
          cd My-App_Backend
          mvn -B verify --file pom.xml
      env:
        PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
    - name: Prepare and validate production Jar
      run: |
        mkdir -p My-App_Backend/target/release
        java --source 17 deploy/nas/PrepareJar.java My-App_Backend/target/my-app-0.0.1-SNAPSHOT.jar My-App_Backend/target/release/app.jar
        java --source 17 deploy/nas/ValidateRelease.java My-App_Backend/target/release/app.jar
    - name: Archive Backend Jar
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: |
          My-App_Backend/target/release/app.jar

    - name: Update dependency graph
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      with:
        directory: My-App_Backend

  push-to-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download jar from build-jar job
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: My-App_Backend/target/release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: basel-homefixer-backend
          IMAGE_TAG: dev
        run: |
          set -euo pipefail
          cd My-App_Backend
          IMAGE="$REGISTRY/$REPOSITORY"
          COMMIT_TAG="sha-$GITHUB_SHA"
          docker build -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:$COMMIT_TAG" .
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,noexec,size=32m --entrypoint java "$IMAGE:$COMMIT_TAG" -Djarmode=tools -jar /app/app.jar help
          docker push "$IMAGE:$COMMIT_TAG"
          docker push "$IMAGE:$IMAGE_TAG"
          printf 'Backend image: %s:%s\n' "$IMAGE" "$COMMIT_TAG" >> "$GITHUB_STEP_SUMMARY"
